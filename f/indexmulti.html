    <!-- ЦЕНТРАЛЬНЫЙ БЛОК С ЧАТБОКСОМ -->
    <div class="rectangle-24">
        <div class="chatbox-wrapper">
            <div class="chatbox-header">
                <h2>. ⋆ * .♡ *:･расскажи какие мультики тебе нравяться˚♡˚‧⁺༄</h2>
            </div>

            <div class="chatbox-body">
                <!-- Секция авторизации -->
                <div id="loginSection">
                    <div class="form-group">
                        <label for="username">Имя</label>
                        <input type="text" id="username" placeholder="Введите свое имя" required>
                    </div>
                    <button class="btn btn-login" id="loginBtn">Войти</button>
                </div>

                <!-- Секция чата -->
                <div id="chatSection">
                    <div class="user-info">
                        <span id="currentUser">Пользователь</span>
                        <button class="btn btn-logout" id="logoutBtn">Выйти</button>
                    </div>

                    <div class="messages-container" id="messagesContainer">
                        <div class="no-messages">Сообщений пока нет. Будьте первым!</div>
                    </div>

                    <div class="form-group">
                        <label for="messageInput">Твое сообщение</label>
                        <textarea id="messageInput" placeholder="Напишите сообщение..." required></textarea>
                    </div>
                    <button class="btn btn-send" id="sendBtn">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Нижняя розовая полоса -->
    <div class="rectangle-22"></div>
