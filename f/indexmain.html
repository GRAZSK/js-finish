<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylemain.css">
    <title>wellcum</title>
</head>
<body>

    <!-- Верхняя навигация -->
    <header class="top-nav">
        <nav class="nav-menu">
            <a href="indexanime.html" class="nav-link">аниме</a>
            <a href="indexfilms.html" class="nav-link">фильмы</a>
            <a href="indexmain.html" class="nav-link active">главная</a>
            <a href="indexfilms.html" class="nav-link">сериалы</a>
            <a href="indexmulti.html" class="nav-link">мультфильмы</a>
        </nav>
    </header>

    
    <main class="main-container">
        
        <!-- Фоновое изображение -->
        <div class="background-layer">
            <img src="./pic/1b4756854166eb5338b2bbc7445c9b46.jpg" alt="фон" class="bg-image-main">
            
        </div>

        <!-- Левая панель с категориями -->
        <aside class="sidebar-left">
            <div class="category-window">
                <div class="window-header"></div>
                <div class="category-list">
                    <label class="category-item">
                        <span class="radio-dot"></span>
                        <span></span>
                    </label>
                    <label class="category-item">
                        <span class="radio-dot"></span>
                        <span></span>
                    </label>
                    <label class="category-item">
                        <span class="radio-dot"></span>
                        <span></span>
                    </label>
                    <label class="category-item">
                        <span class="radio-dot"></span>
                        <span></span>
                    </label>
                </div>
                <button class="search-btn"></button>
            </div>
        </aside>

        <!-- Центральный контент -->
        <section class="content-center">
            
           
            <div class="hello-logo">
                <span class="logo-text"><img src="./pic/71.gif" alt=""></span>
                
            </div>

            <!-- Секция Аниме -->
            <div class="category-section">
                <div class="section-title">
                    <div class="title-bar">аниме</div>
                </div>
                <div class="category-items">
                    <img src="./pic/5d2ab0f3a40c02cb60bf408e0839c9eb.jpg" alt="аниме 1" class="category-img small">
                    <img src="./pic/8149c0b357f240eb5877ded83c6323b5.jpg" alt="аниме 2" class="category-img small">
                    <img src="./pic/b08f8930a108ead6122bd70481bfe8a8.jpg" alt="аниме 3" class="category-img small">
                </div>
            </div>

            <!-- Секция Фильмы -->
            <div class="category-section">
                <div class="section-title">
                    <div class="title-bar">фильмы</div>
                </div>
                <div class="category-items">
                    <img src="./pic/3f188fb84189902fcd9b937daf37c14a.jpg" alt="фильм 1" class="category-img small">
                    <img src="./pic/cfe0ff3b7fb9dc136ef341de679c3346.jpg" alt="фильм 2" class="category-img small">
                    <img src="./pic/c61c1adcda3937ca74be07d2f156c155.jpg" alt="фильм 3" class="category-img small">
                </div>
            </div>

            <!-- Секция Мультфильмы -->
            <div class="category-section">
                <div class="section-title">
                    <div class="title-bar">мультфильмы</div>
                </div>
                <div class="category-logos">
                    <img src="./pic/7a003e1c32d2417e7e87ca0dd201eaef.jpg" alt="монстер хай" class="logo-img">
                    <img src="./pic/f0de2dafdcf1a2c8d71ab34d1334f5d7.jpg" alt="Barbie" class="logo-img barbie">
                    <img src="./pic/9178dcf40ceae52f601fcfeae4261dfc.jpg" alt="My Little Pony" class="logo-img">
                </div>
            </div>

        </section>





        <div class="left-column">
        <section id="dynamic-form-section">
            <h2>здесь пока мало контента , расскажите что вас интерисует и мы обязательно это добавим! </h2>
            <form id="dynamicForm">
                <div class="form-group">
                    <label for="category">что вас интерисует ?:</label>
                    <input type="text" id="category" name="category" required placeholder="Введите что хотите ">
                </div>

                <div id="properties-container">
                    <h3>Характеристики:</h3>
                    <div class="property-row">
                        <input type="text" name="propKey" placeholder="жанр" required>
                        <input type="text" name="propValue" placeholder="количество серий" required>
                    </div>
                </div>

                <button type="button" id="addFieldBtn" class="btn-secondary">+ Добавить еще одно дополнение</button>
                <button type="submit" class="btn-primary">отправить нам </button>
            </form>
            <div id="formMessage" class="message"></div>
        </section>
    </div>

<div class="objects-list" id="objectsList">
    <h3>Список объектов</h3>
    <p>Здесь будет отображаться результат...</p>
</div>
     





    </main>

    <!-- Нижняя навигация -->
    <footer class="bottom-nav">
        <nav class="nav-menu">
            <a href="indexanime.html" class="nav-link">аниме</a>
            <a href="indexfilms.html" class="nav-link">фильмы</a>
            <a href="indexmain.html" class="nav-link active">главная</a>
            <a href="indexfilms.html" class="nav-link">сериалы</a>
            <a href="indexmulti.html" class="nav-link">мультфильмы</a>
        </nav>
    </footer>

    <script src="./scriptmain.js"></script>
</body>
</html>
